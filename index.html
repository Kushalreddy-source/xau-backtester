<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Backtester Pro</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d1117;
color:white;
font-family:Arial,sans-serif;
height:100vh;
overflow:hidden;
}

#topbar{
height:55px;
background:#161b22;
display:flex;
align-items:center;
padding:8px;
gap:6px;
border-bottom:1px solid #30363d;
}

#topbar button{
height:38px;
padding:0 12px;
border:none;
background:#21262d;
color:white;
border-radius:4px;
}

#topbar button:hover{
background:#30363d;
}

#chart{
height:75vh;
width:100%;
}

#bottomPanel{
height:calc(25vh - 55px);
overflow:auto;
padding:10px;
background:#161b22;
border-top:1px solid #30363d;
}

.statGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px;
}

.card{
background:#21262d;
padding:10px;
border-radius:6px;
}

.card h3{
font-size:14px;
margin-bottom:8px;
}

.card span{
font-size:22px;
font-weight:bold;
}

#tradeLog{
margin-top:10px;
}

.tradeRow{
padding:8px;
margin-bottom:6px;
background:#21262d;
border-radius:4px;
}

.win{
border-left:4px solid limegreen;
}

.loss{
border-left:4px solid red;
}

.open{
border-left:4px solid orange;
}

</style>
</head>

<body>

<div id="topbar">

<button id="playBtn">▶</button>

<button id="pauseBtn">⏸</button>

<button id="speed1Btn">1x</button>

<button id="speed2Btn">2x</button>

<button id="speed5Btn">5x</button>

<button id="speed10Btn">10x</button>

<button id="speed15Btn">15x</button>

<button id="longBtn">📈 Long</button>

<button id="shortBtn">📉 Short</button>

</div>

<div id="chart"></div>

<div id="bottomPanel">

<div class="statGrid">

<div class="card">
<h3>Total Trades</h3>
<span id="totalTrades">0</span>
</div>

<div class="card">
<h3>Wins</h3>
<span id="wins">0</span>
</div>

<div class="card">
<h3>Losses</h3>
<span id="losses">0</span>
</div>

<div class="card">
<h3>Win Rate</h3>
<span id="winRate">0%</span>
</div>

<div class="card">
<h3>Current Candle</h3>
<span id="candleNumber">0</span>
</div>

<div class="card">
<h3>Status</h3>
<span id="statusText">Ready</span>
</div>

</div>

<div id="tradeLog">
<h2>Trade Log</h2>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
